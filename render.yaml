# Exported from Render on 2025-01-18T23:00:15Z
services:
- type: web
  name: nexcode.homolog
  runtime: static
  repo: https://github.com/nextlw/cmex_poc
  envVars:
  - key: VITE_APP_NODE_ENV
    sync: false
  - key: VITE_APP_SUPABASE_URL
    sync: false
  - key: VITE_API_BASE_URL
    sync: false
  - key: VITE_APP_SUPABASE_ANON_KEY
    sync: false
  buildCommand: npm run build
  staticPublishPath: dist
  rootDir: frontend
  previews:
    generation: automatic
- type: web
  name: cmex-poc-backend
  env: python
  buildCommand: pip install -r requirements.txt
  startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
  envVars:
    - key: PYTHON_VERSION
      value: 3.11.0
version: "1"

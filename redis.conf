# Configuração Redis para o projeto CMEX
# Porta personalizada para evitar conflitos
port 6378

# Configurações básicas
daemonize yes
pidfile /Users/williamduarte/NCMproduto/cmex_poc/redis_6378.pid
logfile /Users/williamduarte/NCMproduto/cmex_poc/redis_6378.log

# Diretório para armazenamento de dados persistentes
dir /Users/williamduarte/NCMproduto/cmex_poc/redis-data

# Limites de memória
maxmemory 256mb
maxmemory-policy allkeys-lru

# Configurações de desempenho
databases 16
save 900 1
save 300 10
save 60 10000

# Segurança básica (considere adicionar senha em ambiente de produção)
# requirepass SuaSenhaSeguraAqui

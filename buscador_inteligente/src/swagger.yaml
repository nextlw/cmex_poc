openapi: 3.0.0
info:
  title: API de Busca Inteligente NCM
  description: API para consulta de NCM utilizando modelos de IA
  version: 1.0.0
  contact:
    name: Equipe CMEX
servers:
  - url: /api/v1
    description: Servidor de desenvolvimento
tags:
  - name: NCM
    description: Operações relacionadas à consulta de NCM
  - name: DeepResearch
    description: Operações relacionadas à análise profunda de NCM
paths:
  /ncm:
    post:
      tags:
        - NCM
      summary: Consulta a classificação fiscal (NCM) de produtos
      description: Retorna a classificação fiscal (NCM) de um produto com base na descrição fornecida
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NCMRequest"
      responses:
        "200":
          description: Consulta realizada com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NCMResponse"
        "400":
          description: Parâmetros inválidos
        "500":
          description: Erro interno do servidor
  /ncm/deep-research:
    post:
      tags:
        - DeepResearch
      summary: Inicia uma análise profunda de NCM
      description: Inicia um processo de análise profunda para validar a classificação fiscal (NCM) de um produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeepResearchRequest"
      responses:
        "202":
          description: Análise iniciada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
                    description: ID da requisição para acompanhamento
                  message:
                    type: string
                    description: Mensagem de status
        "400":
          description: Parâmetros inválidos
        "500":
          description: Erro interno do servidor
  /ncm/deep-research/{requestId}:
    get:
      tags:
        - DeepResearch
      summary: Obtém o status de uma análise profunda
      description: Retorna o status atual de uma análise profunda em andamento
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
          description: ID da requisição de análise profunda
      responses:
        "200":
          description: Status obtido com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeepResearchStatus"
        "404":
          description: Análise não encontrada
        "500":
          description: Erro interno do servidor
components:
  schemas:
    NCMRequest:
      type: object
      required:
        - consulta
        - estadoOrigem
        - modelo
      properties:
        consulta:
          type: string
          description: Descrição do produto
          example: "Smartphone com tela de 6.5 polegadas, 128GB de armazenamento"
        estadoOrigem:
          type: string
          description: Estado de origem (sigla)
          example: "SP"
        operacao:
          type: string
          description: Tipo de operação
          example: "venda"
        regimeTributario:
          type: string
          description: Regime tributário
          example: "simples"
        tributacao:
          type: string
          description: Tipo de tributação
          example: "normal"
        modelo:
          type: string
          description: Modelo de IA a ser utilizado
          example: "gemini-2.0-flash"
        useDeepResearch:
          type: boolean
          description: Ativa o modo de análise profunda
          default: false
    NCMResponse:
      type: object
      properties:
        ncm:
          type: string
          description: Código NCM
          example: "8517.12.31"
        descricao:
          type: string
          description: Descrição do NCM
          example: "Telefones móveis (smartphones)"
        atributos:
          type: array
          items:
            type: string
          description: Atributos do produto
          example: ["Comunicação sem fio", "Tela touchscreen"]
        atributos_tipi:
          type: array
          items:
            type: string
          description: Atributos específicos da TIPI
          example: ["Ex 01 - Smartphones"]
        valores_de_impostos:
          type: object
          properties:
            ipi:
              type: string
              description: Valor do IPI
              example: "15%"
            icms:
              type: object
              additionalProperties:
                type: string
              description: Valores de ICMS por estado
              example: { "SP": "18%", "RJ": "20%" }
            pis:
              type: string
              description: Valor do PIS
              example: "1.65%"
            cofins:
              type: string
              description: Valor do COFINS
              example: "7.6%"
    DeepResearchRequest:
      type: object
      required:
        - ncm
        - descricao
        - consulta
      properties:
        ncm:
          type: string
          description: Código NCM a ser validado
          example: "8517.12.31"
        descricao:
          type: string
          description: Descrição do NCM
          example: "Telefones móveis (smartphones)"
        consulta:
          type: string
          description: Descrição do produto
          example: "Smartphone com tela de 6.5 polegadas, 128GB de armazenamento"
    DeepResearchStatus:
      type: object
      properties:
        requestId:
          type: string
          description: ID da requisição
          example: "dr-123456"
        status:
          type: string
          enum: ["pending", "processing", "completed", "error"]
          description: Status atual da análise
          example: "processing"
        progress:
          type: number
          description: Progresso da análise (0-100)
          example: 65
        result:
          type: object
          properties:
            isValid:
              type: boolean
              description: Indica se o NCM é válido para o produto
              example: true
            confidence:
              type: number
              description: Nível de confiança da validação (0-100)
              example: 95
            suggestedNCM:
              type: string
              description: NCM sugerido (se diferente do original)
              example: "8517.12.31"
            reason:
              type: string
              description: Justificativa da validação
              example: "O produto descrito corresponde à classificação de smartphones conforme a TIPI"

  /api/v1/query:
    post:
      summary: Inicia uma nova consulta à LLM
      tags:
        - Consultas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Query"
      responses:
        "200":
          description: ID da requisição gerado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId:
                    type: string
        "400":
          description: Parâmetros inválidos
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/outputs:
    get:
      summary: Obtém todas as saídas da LLM
      tags:
        - Monitoramento
      responses:
        "200":
          description: Lista de todas as saídas da LLM
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LLMOutput"

  /api/v1/task/{requestId}:
    get:
      summary: Obtém o resultado de uma tarefa específica
      tags:
        - Resultados
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
          description: ID da requisição
      responses:
        "200":
          description: Resultado da tarefa encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskResult"
        "404":
          description: Tarefa não encontrada
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /api/v1/stream/{requestId}:
    get:
      summary: Acompanha o progresso de uma consulta em tempo real
      tags:
        - Monitoramento
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
          description: ID da requisição
      responses:
        "200":
          description: Stream de eventos SSE estabelecido
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [connected, progress, answer, error]
                  data:
                    type: object
                  trackers:
                    type: object
                    properties:
                      tokenUsage:
                        type: number
                      actionState:
                        type: object
                  outputs:
                    type: array
                    items:
                      type: object

  /api/v1/logs:
    get:
      summary: Obtém todos os logs do servidor e conteúdos dos prompts
      tags:
        - Logs
      responses:
        "200":
          description: Logs do servidor e conteúdos dos prompts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"

  /api-docs:
    get:
      summary: Documentação da API
      tags:
        - Documentation
      responses:
        "200":
          description: Documentação da API
